name: Versioned Release

on:
  push:
    branches:
      - main

permissions:
  contents: write # we need this to be able to push tags
  pull-requests: read

jobs:
  release_tag:
    uses: openmcp-project/build/.github/workflows/release.lib.yaml@c2d37b930a47b3596b919583887f92c7e37987e3 # main
    secrets:
      app_private_key: ${{ secrets.ODG_BOT_PRIVATE_KEY }}
    with:
      app_id: ${{ vars.ODG_BOT_APP_ID }}
