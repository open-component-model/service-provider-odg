name: Publish

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  packages: write

jobs:
  release_publish:
    uses: openmcp-project/build/.github/workflows/publish.lib.yaml@ca63f82696e8311fa8494cfa59221a58f1787e59 # main
    secrets:
      app_private_key: ${{ secrets.ODG_BOT_PRIVATE_KEY }}
    with:
      app_id: ${{ vars.ODG_BOT_APP_ID }}
