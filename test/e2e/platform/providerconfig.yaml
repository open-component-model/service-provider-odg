apiVersion: odg.services.open-control-plane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: odg
spec:
  charts:
    - chartName: bootstrapping
      chartPullSecretName: privateregcred
      chartURL: europe-docker.pkg.dev/gardener-project/releases/charts/odg/bootstrapping
      chartVersion: 0.1371.0
      helmValues:
        extensions_cfg:
          defaults:
            delivery_dashboard_url: https://delivery-dashboard<workload-shoot-domain-placeholder>
            delivery_service_url: http://delivery-service.odg-system.svc.cluster.local:8080
          artefact_enumerator:
            enabled: true
          backlog_controller:
            enabled: true
          cache_manager:
            enabled: true
          responsibles:
            enabled: true
    - chartName: delivery-dashboard
      chartPullSecretName: privateregcred
      chartURL: oci://europe-docker.pkg.dev/gardener-project/releases/charts/odg/delivery-dashboard
      chartVersion: 0.441.0
      helmValues:
        envVars:
          REACT_APP_DELIVERY_SERVICE_API_URL: https://delivery-service<workload-shoot-domain-placeholder>
        host: delivery-dashboard<workload-shoot-domain-placeholder>
    - chartName: delivery-service
      chartPullSecretName: privateregcred
      chartURL: europe-docker.pkg.dev/gardener-project/releases/charts/odg/delivery-service
      chartVersion: 0.1371.0
      helmValues:
        host: delivery-service<workload-shoot-domain-placeholder>
        gateway:
          annotations:
            cert.gardener.cloud/dnsnames: '"*<workload-shoot-domain-placeholder>"'
            cert.gardener.cloud/purpose: managed
            dns.gardener.cloud/class: garden
            dns.gardener.cloud/dnsnames: '"*"'
          enabled: true
    - chartName: extensions
      chartPullSecretName: privateregcred
      chartURL: europe-docker.pkg.dev/gardener-project/releases/charts/odg/extensions
      chartVersion: 0.1371.0
      helmValues:
        artefact-enumerator:
          enabled: true
        backlog-controller:
          enabled: true
        cache-manager:
          enabled: true
        responsibles:
          enabled: true
    - chartName: delivery-db
      chartPullSecretName: privateregcred
      chartURL: europe-docker.pkg.dev/gardener-project/releases/charts/ocm-gear/postgresql
      chartVersion: 16.6.1
      helmValues:
        auth:
          existingSecret: delivery-db-password
        fullnameOverride: delivery-db
        global:
          security:
            allowInsecureImages: true
        image:
          registry: ''
          repository: europe-docker.pkg.dev/gardener-project/releases/ocm-gear/postgres
          tag: 16.8.0
        postgresqlDataDir: /data/pgdata
        primary:
          containerSecurityContext:
            readOnlyRootFilesystem: false
          extraEnvVars:
            - name: POSTGRESQL_MAX_CONNECTIONS
              value: '200'
          resources:
            requests:
              memory: 256Mi
          persistence:
            mountPath: /data/
  pollInterval: 1m
