apiVersion: odg.services.open-control-plane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: odg
spec:
  pollInterval: 1m
  versions:
    # renovate: datasource=docker depName=ghcr.io/open-component-model/kubernetes/controller/chart
    - chartVersion: "0.13.0"
      chartURL: oci://ghcr.io/open-component-model/kubernetes/controller/chart
      chartPullSecretName: privateregcred
      helmValues:
        manager:
          imagePullSecrets:
            - name: privateregcred
