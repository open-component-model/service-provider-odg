apiVersion: odg.services.open-control-plane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: odg
spec:
  charts:
    - chartName: bootstrapping
      chartPullSecretName: privateregcred
      chartURL: europe-docker.pkg.dev/gardener-project/releases/charts/odg/bootstrapping
      chartVersion: 0.1371.0
      helmValues:
        extensions_cfg:
          defaults:
            delivery_dashboard_url: https://delivery-dashboard<workload-shoot-domain-placeholder>
            delivery_service_url: http://delivery-service.odg-system.svc.cluster.local:8080
          artefact_enumerator:
            enabled: true
          backlog_controller:
            enabled: true
          cache_manager:
            enabled: true
          responsibles:
            enabled: true
        secrets:
          delivery-db:
            local:
              username: postgres
              password: foo
    - chartName: delivery-dashboard
      chartPullSecretName: privateregcred
      chartURL: oci://europe-docker.pkg.dev/gardener-project/releases/charts/odg/delivery-dashboard
      chartVersion: 0.441.0
      helmValues:
        envVars:
          REACT_APP_DELIVERY_SERVICE_API_URL: https://delivery-service<workload-shoot-domain-placeholder>
        host: delivery-dashboard<workload-shoot-domain-placeholder>
    - chartName: delivery-service
      chartPullSecretName: privateregcred
      chartURL: europe-docker.pkg.dev/gardener-project/releases/charts/odg/delivery-service
      chartVersion: 0.1371.0
      helmValues:
        host: delivery-service<workload-shoot-domain-placeholder>
        gateway:
          annotations:
            cert.gardener.cloud/dnsnames: '"*<workload-shoot-domain-placeholder>"'
            cert.gardener.cloud/purpose: managed
            dns.gardener.cloud/class: garden
            dns.gardener.cloud/dnsnames: '"*"'
          enabled: true
    - chartName: extensions
      chartPullSecretName: privateregcred
      chartURL: europe-docker.pkg.dev/gardener-project/releases/charts/odg/extensions
      chartVersion: 0.1371.0
    - chartName: delivery-db
      chartPullSecretName: privateregcred
      chartURL: europe-docker.pkg.dev/gardener-project/releases/charts/ocm-gear/postgresql
      chartVersion: 16.6.1
      helmValues:
        auth:
          existingSecret: delivery-db-password
        fullnameOverride: delivery-db
        global:
          security:
            allowInsecureImages: true
        image:
          registry: ''
          repository: europe-docker.pkg.dev/gardener-project/releases/ocm-gear/postgres
          tag: 16.8.0
        postgresqlDataDir: /data/pgdata
        primary:
          containerSecurityContext:
            readOnlyRootFilesystem: false
          extraEnvVars:
            - name: POSTGRESQL_MAX_CONNECTIONS
              value: '200'
          resources:
            requests:
              memory: 256Mi
          persistence:
            mountPath: /data/
    # otel telemetry — public charts now, SAP-internal registry later (switch =
    # chartURL + chartPullSecretName: artifactory; see discussions/12-otel/02-…)
    # otel collector — no operator, no webhook probes, just the collector daemonset
    - chartName: otel-collector
      chartURL: ghcr.io/open-telemetry/opentelemetry-helm-charts/opentelemetry-collector
      chartVersion: 0.139.0
      # intentionally no chartPullSecretName — public OCI
      # no layerSelector needed — chart publishes as single-layer
      helmTimeout: 5m
      helmValues:
        mode: daemonset
        fullnameOverride: otel-collector
        image:
          repository: otel/opentelemetry-collector-contrib
        clusterRole:
          create: true
        # presets all default to disabled in chart 0.139.0 — no preset block needed.
        # filelog needs host log mounts (normally added by the logsCollection preset, which is off).
        extraVolumes:
          - name: varlogpods
            hostPath: {path: /var/log/pods}
          - name: varlibdockercontainers
            hostPath: {path: /var/lib/docker/containers}
        extraVolumeMounts:
          - {name: varlogpods, mountPath: /var/log/pods, readOnly: true}
          - {name: varlibdockercontainers, mountPath: /var/lib/docker/containers, readOnly: true}
        config:
          extensions:
            health_check: {}
          receivers:
            filelog:
              include: [/var/log/pods/odg-system_*/*/*.log]
              start_at: end
              include_file_path: true
              operators:
                - id: container-parser
                  type: container
                  add_metadata_from_filepath: true
                - id: json-parser
                  type: json_parser
                  if: 'body matches "^{"'
            otlp:
              protocols:
                grpc:
                  endpoint: "0.0.0.0:4317"
            hostmetrics:
              collection_interval: 30s
              scrapers:
                cpu:
                  metrics:
                    system.cpu.utilization: {enabled: true}
                memory:
                  metrics:
                    system.memory.utilization: {enabled: true}
          processors:
            k8sattributes:
              auth_type: serviceAccount
              filter:
                namespace: odg-system
              pod_association:
                - sources:
                    - from: resource_attribute
                      name: k8s.pod.uid
              extract:
                metadata: [k8s.namespace.name, k8s.pod.name, k8s.deployment.name, k8s.container.name]
                annotations:
                  - key: otel.io/pod-logs
                    from: pod
            filter/only_annotated:
              error_mode: ignore
              logs:
                log_record:
                  - 'resource.attributes["k8s.pod.annotation.otel.io/pod-logs"] != "true"'
            batch:
              timeout: 5s
              send_batch_size: 1024
              send_batch_max_size: 2048
            memory_limiter:
              check_interval: 1s
              limit_mib: 512
              spike_limit_mib: 128
          exporters:
            debug:
              verbosity: basic
            prometheus:
              endpoint: "0.0.0.0:8889"
              resource_to_telemetry_conversion: {enabled: true}
          service:
            extensions: [health_check]
            telemetry:
              metrics:
                level: basic
            pipelines:
              logs:
                receivers: [filelog]
                processors: [memory_limiter, k8sattributes, filter/only_annotated, batch]
                exporters: [debug]
              metrics:
                receivers: [otlp, hostmetrics]
                processors: [memory_limiter, batch]
                exporters: [debug, prometheus]   # prometheus serves :8889 for scraping
              traces:
                receivers: [otlp]
                processors: [memory_limiter, batch]
                exporters: [debug]
    - chartName: metrics-operator
      chartURL: ghcr.io/openmcp-project/charts/metrics-operator
      chartVersion: v1.2.0   # published tags carry the v prefix
      # intentionally no chartPullSecretName — public OCI, single-layer artifact (no layerSelector needed)
  pollInterval: 1m
