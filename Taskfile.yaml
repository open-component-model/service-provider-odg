version: 3

vars:
  NESTED_MODULES: api
  API_DIRS: '{{.ROOT_DIR}}/api/v1alpha1/...'
  MANIFEST_OUT: '{{.ROOT_DIR}}/api/crds/manifests'
  CODE_DIRS: '{{.ROOT_DIR}}/cmd/... {{.ROOT_DIR}}/internal/... {{.ROOT_DIR}}/api/v1alpha1/...'
  COMPONENTS: 'service-provider-odg'
  REPO_URL: 'https://github.com/open-component-model/service-provider-odg'
  COMMON_SCRIPT_DIR: '{{.ROOT_DIR}}/hack/common'

includes:
  shared:
    taskfile: hack/common/Taskfile_controller.yaml
    flatten: true

tasks:
  install-flux:
    desc: "Install Flux CLI for e2e tests"
    vars:
      FLUX_VERSION: v2.9.4
      FLUX_BINARY: '{{.ROOT_DIR}}/bin/flux'
    status:
      - test -x "{{.FLUX_BINARY}}"
      - '{{.FLUX_BINARY}} --version | grep -q "{{.FLUX_VERSION | trimPrefix "v"}}"'
    cmds:
      - mkdir -p {{.ROOT_DIR}}/bin
      - |
        TMPDIR=$(mktemp -d)
        curl -sfL "https://github.com/fluxcd/flux2/releases/download/{{.FLUX_VERSION}}/flux_{{.FLUX_VERSION | trimPrefix "v"}}_{{OS}}_{{ARCH}}.tar.gz" -o "$TMPDIR/flux.tar.gz"
        tar -xzf "$TMPDIR/flux.tar.gz" -C "$TMPDIR"
        mv "$TMPDIR/flux" "{{.FLUX_BINARY}}"
        chmod +x "{{.FLUX_BINARY}}"
        rm -rf "$TMPDIR"

  build:img:build-test:
    desc: "Build image for current platform and tag without suffix for testing"
    cmds:
      - task: build:img:build
      - docker tag ghcr.io/openmcp-project/images/{{.COMPONENTS}}:{{.VERSION}}-linux-{{ARCH}} ghcr.io/openmcp-project/images/{{.COMPONENTS}}:{{.VERSION}}
    vars:
      VERSION:
        sh: $COMMON_SCRIPT_DIR/get-version.sh
      ARCH:
        sh: uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/'

  test-e2e:
    desc: "Build image and run e2e tests"
    deps:
      - install-flux
    cmds:
      - task: build:img:build-test
      - go test -v ./test/e2e/... -count=1